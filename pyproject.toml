
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "raphaeldl"
requires-python = ">=3.11"
version = "1.0.0"
description = "A command-line video downloader powered by yt-dlp"
readme = "README.md"
dependencies = [
    "yt-dlp",
    "InquirerPy",
    "rich"
]

[project.scripts]
rpdl = "help:main"

[tool.setuptools]
py-modules = ["help", "core"]
